<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Friend AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f5f7;color:#111827}
    .app{max-width:720px;margin:auto;height:100vh;display:flex;flex-direction:column;background:white}
    header{padding:16px;background:#111827;color:white;display:flex;justify-content:space-between;align-items:center}
    header h1{font-size:20px;margin:0}.select{background:#374151;color:white;border:0;border-radius:10px;padding:9px}
    #chat{flex:1;overflow:auto;padding:16px}.msg{max-width:82%;padding:11px 14px;margin:9px 0;border-radius:16px;line-height:1.4;white-space:pre-wrap}
    .user{margin-left:auto;background:#dbeafe}.bot{background:#f3f4f6}
    form{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
    input{flex:1;border:1px solid #d1d5db;border-radius:22px;padding:12px 15px;font-size:16px;outline:none}
    button{border:0;border-radius:22px;padding:0 18px;background:#111827;color:white;font-weight:600}
    .hint{text-align:center;color:#6b7280;font-size:12px;padding:0 12px 6px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>❤️ Friend AI</h1>
    <select id="personality" class="select">
      <option value="girl">Girl style</option>
      <option value="boy">Boy style</option>
    </select>
  </header>
  <main id="chat"></main>
  <div class="hint">Friendly AI companion • Don't share passwords or private secrets.</div>
  <form id="form">
    <input id="message" autocomplete="off" placeholder="Type a message..." required>
    <button>Send</button>
  </form>
</div>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const message = document.getElementById("message");
const personality = document.getElementById("personality");
let history = [];

function add(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

add("Heyy 👋 Batao, kya scene hai?", "bot");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = message.value.trim();
  if (!text) return;
  add(text, "user");
  message.value = "";
  const oldHistory = history.slice(-14);
  history.push({role:"user", content:text});
  add("Typing…", "bot");
  const typing = chat.lastChild;

  try {
    const r = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text, history:oldHistory, personality:personality.value})
    });
    const data = await r.json();
    typing.remove();
    if (!r.ok) throw new Error(data.error || "Request failed");
    add(data.reply, "bot");
    history.push({role:"assistant", content:data.reply});
  } catch (err) {
    typing.textContent = "Sorry, abhi connection/API issue aa raha hai.";
  }
});
</script>
</body>
</html>
